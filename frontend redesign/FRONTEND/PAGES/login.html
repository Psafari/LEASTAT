<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Leastat</title>
</head>
<body>
    <div class="form-container">
        
        <div class="form-elements">
            <div class="actions">
                <span>Signin</span>
                <span>SignUp</span>
            </div>
        
            <div>
                <label for="email">Email</label>
                <input id="email" type="text" name="user_email" placeholder="eg.theleasidegroup.com"> <!--the name value is what whatever theinput is gets assigned to and sent to db-->
            </div>   
            <div class="department-section">
                <label for="Department">Department</label>
                <select id="Department" type="" name="user_department"> 
                    <option>Select Department</option>
                    <option>Frontdesk Assistant</option>
                    <option>Manager</option>
                </select>  
            </div>    
            <div class="password-input">
                <label for="password">Password</label>
                <input id="password" type="password" name="user_password" required>
            </div>
            <div class="submit=button">
                <button>Submit</button>
            </div>
        </div>

    </div>
    
    <footer>
        © 2025 Leastat Analytics. All rights reserved.  
        Contact: support@leastat.io  
        Privacy Policy | Terms of Service  
        Version 1.0.0
    </footer>    
</body>
</html>
